server:
  port: 8661
spring:
  application:
    name: auth

  datasource:
    url: jdbc:oracle:thin:@localhost:1521/xepdb1
    username: um
    password: um
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.Oracle12cDialect

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka

  instance:
    preferIpAddress: true

keyStore:
  path: keystore.jks
  password: password
  alias: my-server-key
  expiryTime: 90

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
