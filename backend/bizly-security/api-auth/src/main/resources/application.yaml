    username: marcelinoatallah6@gmail.com
    password: bnaw msxy igfm iwpm
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka

  instance:
    preferIpAddress: true

keyStore:
  path: keystore.jks
  password: password
  alias: my-server-key
  expiryTime: 90

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

app:
  password-reset:
    expiry-minutes: 15
    reset-url: http://localhost:4200/authentication/forgot-password
  security:
    max-failed-login-attempts: 3
  registration:
    # When true, new businesses start as PENDING_APPROVAL until a super-admin completes the UM workflow.
    # Overridden by UM.UM_PLATFORM_CONFIG.approval_flow_enabled when that row exists.
    require-super-admin-business-approval: true
    verify-url: http://localhost:4200/authentication/verify-email
    verify-expiry-minutes: 1440
  subscription:
    # Payment provider webhook: POST /auth/webhooks/payment/subscription with header X-Webhook-Secret
    webhook-secret: change-me-in-production

# Outbound Google tokeninfo (SocialLoginServiceImpl). Raise if you still see read timeouts on slow networks.
social:
  google:
    connect-timeout-ms: 15000
    read-timeout-ms: 30000
