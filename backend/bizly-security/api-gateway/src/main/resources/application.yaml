server:
  port: 8080
spring:
  main:
    web-application-type: reactive
  codec:
    max-in-memory-size: 33554432
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB
  application:
    name: apigateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
            - http://localhost:4200
            allowedMethods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
            allowedHeaders: '*'
            allowCredentials: true
      default-filters:
      - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      routes:
      - id: auth
        uri: lb://auth
        predicates:
        - Path=/auth/**
        filters:
        - AuthenticationPreFilter
        
      - id: um
        uri: lb://um
        predicates:
        - Path=/um/**
        filters:
        - AuthenticationPreFilter
        - StripPrefix=1
  
      - id: kyc
        uri: lb://kyc
        predicates:
        - Path=/kyc/**
        filters:
        - AuthenticationPreFilter
        - name: WorkflowDeferral
        - StripPrefix=1   
        
      - id: pm
        uri: lb://pm
        predicates:
        - Path=/pm/**
        filters:
        - AuthenticationPreFilter
        - name: WorkflowDeferral
        - StripPrefix=1

      - id: settings
        uri: lb://settings
        predicates:
        - Path=/settings/**
        filters:
        - AuthenticationPreFilter
        - name: WorkflowDeferral
        - StripPrefix=1

      - id: bm
        uri: lb://bm
        predicates:
        - Path=/bm/**
        filters:
        - AuthenticationPreFilter
        - name: WorkflowDeferral
        - StripPrefix=1

      - id: travel
        uri: lb://travel
        predicates:
        - Path=/travel/**
        filters:
        - AuthenticationPreFilter
        - name: WorkflowDeferral
        - StripPrefix=1

      - id: broadcast
        uri: lb://broadcast
        predicates:
        - Path=/broadcast/**
        filters:
        - AuthenticationPreFilter
        - name: WorkflowDeferral
        - StripPrefix=1
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    preferIpAddress: true
keyStore:
  path: keystore.jks
  password: password
  alias: my-server-key

bizly:
  workflow:
    deferral-enabled: true
 