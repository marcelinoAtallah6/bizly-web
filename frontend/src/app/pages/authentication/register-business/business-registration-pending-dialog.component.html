<h2 mat-dialog-title>Business approval</h2>
<mat-dialog-content>
  <p>Your business requires approval before you can use every part of the portal.</p>
  <p>An administrator will review your registration. You can continue using the app; some actions may stay restricted until approval completes.</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-flat-button color="primary" mat-dialog-close>OK</button>
</mat-dialog-actions>
