<h2 mat-dialog-title>{{ data.mode === 'create' ? 'New service' : 'Edit service' }}</h2>

<mat-dialog-content class="svc-dialog">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <mat-form-field appearance="outline" class="full">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" autocomplete="off" />
      <mat-error *ngIf="form.controls.name.hasError('required')">Required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description" rows="3"></textarea>
    </mat-form-field>

    <div class="row2">
      <mat-form-field appearance="outline">
        <mat-label>Price</mat-label>
        <input matInput type="number" formControlName="price" min="0" step="0.01" />
        <mat-error *ngIf="form.controls.price.hasError('required')">Required</mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Duration (min)</mat-label>
        <input matInput type="number" formControlName="durationMinutes" min="1" step="1" />
        <mat-error *ngIf="form.controls.durationMinutes.hasError('required')">Required</mat-error>
      </mat-form-field>
    </div>

    <mat-slide-toggle formControlName="active" class="m-b-12">Active</mat-slide-toggle>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()" [disabled]="saving">Cancel</button>
  <button mat-flat-button color="primary" type="button" (click)="submit()" [disabled]="saving">
    {{ saving ? 'Saving…' : 'Save' }}
  </button>
</mat-dialog-actions>
