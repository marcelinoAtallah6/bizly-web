<div class="dashboard-page p-24">

  <p
    class="text-muted mat-body-2 m-b-16 m-t-0"
    *ngIf="dashCtx.detailSnapshot?.description as desc"

    {{ desc }}

  <app-dynamic-dashboard-view></app-dynamic-dashboard-view>
</div>
