<div class="p-24">
  <app-page-action-bar
    [title]="mode === 'create' ? 'New customer' : 'Edit customer'"
    [toolbar]="formToolbar"
  ></app-page-action-bar>

  <mat-card *ngIf="!loading">
    <mat-card-content class="p-24">
      <form [formGroup]="form" (ngSubmit)="submit()" class="customer-form">
        <div class="row">
          <div class="col-md-6">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>First name</mat-label>
              <input matInput formControlName="firstName" autocomplete="given-name" />
              <mat-error *ngIf="form.get('firstName')?.hasError('required')">Required</mat-error>
            </mat-form-field>
          </div>
          <div class="col-md-6">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>Last name</mat-label>
              <input matInput formControlName="lastName" autocomplete="family-name" />
              <mat-error *ngIf="form.get('lastName')?.hasError('required')">Required</mat-error>
            </mat-form-field>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>Date of birth</mat-label>
              <input matInput [matDatepicker]="dobPicker" formControlName="dob" />
              <mat-datepicker-toggle matSuffix [for]="dobPicker"></mat-datepicker-toggle>
              <mat-datepicker #dobPicker></mat-datepicker>
              <mat-error *ngIf="form.get('dob')?.hasError('required')">Required</mat-error>
            </mat-form-field>
          </div>
          <div class="col-md-6">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>Email</mat-label>
              <input matInput type="email" formControlName="email" autocomplete="email" />
              <mat-error *ngIf="form.get('email')?.hasError('required')">Required</mat-error>
              <mat-error *ngIf="form.get('email')?.hasError('email')">Invalid email</mat-error>
            </mat-form-field>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>Mobile</mat-label>
              <input matInput formControlName="mobileNumber" autocomplete="tel" />
              <mat-hint>7–15 digits, optional leading +</mat-hint>
              <mat-error *ngIf="form.get('mobileNumber')?.hasError('required')">Required</mat-error>
              <mat-error *ngIf="form.get('mobileNumber')?.hasError('pattern')">Invalid mobile</mat-error>
            </mat-form-field>
          </div>
          <div class="col-md-6">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>Customer status</mat-label>
              <mat-select formControlName="customerStatus">
                <mat-option *ngFor="let s of customerStatusOptions" [value]="s">{{ s }}</mat-option>
              </mat-select>
              <mat-error *ngIf="form.get('customerStatus')?.hasError('required')">Required</mat-error>
            </mat-form-field>
          </div>
        </div>

        <mat-divider class="m-y-16"></mat-divider>
        <h3 class="m-0 m-b-16 f-s-16">Address</h3>

        <div class="row">
          <div class="col-md-12">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>Address line 1</mat-label>
              <input matInput formControlName="addressLine1" autocomplete="address-line1" />
            </mat-form-field>
          </div>
        </div>
        <div class="row">
          <div class="col-md-12">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>Address line 2</mat-label>
              <input matInput formControlName="addressLine2" autocomplete="address-line2" />
            </mat-form-field>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>City</mat-label>
              <input matInput formControlName="city" autocomplete="address-level2" />
            </mat-form-field>
          </div>
          <div class="col-md-6">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>State / province</mat-label>
              <input matInput formControlName="stateProvince" autocomplete="address-level1" />
            </mat-form-field>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>Postal code</mat-label>
              <input matInput formControlName="postalCode" autocomplete="postal-code" />
            </mat-form-field>
          </div>
          <div class="col-md-6">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>Country</mat-label>
              <input matInput formControlName="country" autocomplete="country-name" />
            </mat-form-field>
          </div>
        </div>

        <div class="m-t-24 d-flex gap-8">
          <button mat-flat-button color="primary" type="submit" [disabled]="saving">
            {{ mode === 'create' ? 'Create' : 'Save' }}
          </button>
          <button mat-stroked-button type="button" (click)="cancel()" [disabled]="saving">Cancel</button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>

  <div *ngIf="loading" class="d-flex justify-content-center p-48">
    <mat-spinner diameter="40"></mat-spinner>
  </div>
</div>
