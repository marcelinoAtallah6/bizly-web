<h2 mat-dialog-title>{{ isEdit ? 'Edit follow-up' : 'New follow-up' }}</h2>
<mat-dialog-content *ngIf="ready" [formGroup]="form">
  <mat-form-field appearance="outline" class="full">
    <mat-label>Subject</mat-label>
    <input matInput formControlName="subject" />
  </mat-form-field>
  <app-travel-entity-picker formControlName="client" entityType="client" label="Client"></app-travel-entity-picker>
  <app-travel-entity-picker
    formControlName="booking"
    entityType="booking"
    label="Booking (optional)"
    [filterBookingByClientId]="filterClientId"
  ></app-travel-entity-picker>
  <app-travel-entity-picker
    formControlName="consultant"
    entityType="user"
    label="Assigned consultant"
    hint="Search team members"
  ></app-travel-entity-picker>
  <div class="row-datetime">
    <mat-form-field appearance="outline" class="full">
      <mat-label>Due date</mat-label>
      <input matInput [matDatepicker]="duePicker" formControlName="dueDate" />
      <mat-datepicker-toggle matSuffix [for]="duePicker"></mat-datepicker-toggle>
      <mat-datepicker #duePicker></mat-datepicker>
    </mat-form-field>
    <mat-form-field appearance="outline" class="full">
      <mat-label>Time</mat-label>
      <input matInput type="time" formControlName="dueTime" />
    </mat-form-field>
  </div>
  <mat-form-field appearance="outline" class="full">
    <mat-label>Status</mat-label>
    <mat-select formControlName="status">
      <mat-option *ngFor="let s of statusOptions" [value]="s">{{ s }}</mat-option>
    </mat-select>
  </mat-form-field>
  <mat-form-field appearance="outline" class="full">
    <mat-label>Notes</mat-label>
    <textarea matInput formControlName="notes" rows="2"></textarea>
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancel</button>
  <button mat-flat-button color="primary" type="button" (click)="save()" [disabled]="saving || !ready">Save</button>
</mat-dialog-actions>
