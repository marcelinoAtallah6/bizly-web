<h2 mat-dialog-title>{{ isEdit ? 'Edit invoice' : 'New invoice' }}</h2>
<mat-dialog-content *ngIf="ready" [formGroup]="form">
  <app-travel-entity-picker
    formControlName="booking"
    entityType="booking"
    label="Booking"
    [required]="true"
  ></app-travel-entity-picker>
  <mat-form-field appearance="outline" class="full">
    <mat-label>Invoice number</mat-label>
    <input matInput formControlName="invoiceNo" />
  </mat-form-field>
  <mat-form-field appearance="outline" class="full">
    <mat-label>Amount</mat-label>
    <input matInput type="number" min="0" formControlName="amount" />
  </mat-form-field>
  <mat-form-field appearance="outline" class="full">
    <mat-label>Currency</mat-label>
    <input matInput formControlName="currency" />
  </mat-form-field>
  <mat-form-field appearance="outline" class="full">
    <mat-label>Status</mat-label>
    <mat-select formControlName="status">
      <mat-option *ngFor="let s of statusOptions" [value]="s">{{ s }}</mat-option>
    </mat-select>
  </mat-form-field>
  <div class="row-datetime">
    <mat-form-field appearance="outline" class="full">
      <mat-label>Issued date</mat-label>
      <input matInput [matDatepicker]="issuedPicker" formControlName="issuedDate" />
      <mat-datepicker-toggle matSuffix [for]="issuedPicker"></mat-datepicker-toggle>
      <mat-datepicker #issuedPicker></mat-datepicker>
    </mat-form-field>
    <mat-form-field appearance="outline" class="full">
      <mat-label>Time</mat-label>
      <input matInput type="time" formControlName="issuedTime" />
    </mat-form-field>
  </div>
  <div class="row-datetime">
    <mat-form-field appearance="outline" class="full">
      <mat-label>Due date</mat-label>
      <input matInput [matDatepicker]="duePicker" formControlName="dueDate" />
      <mat-datepicker-toggle matSuffix [for]="duePicker"></mat-datepicker-toggle>
      <mat-datepicker #duePicker></mat-datepicker>
    </mat-form-field>
    <mat-form-field appearance="outline" class="full">
      <mat-label>Time</mat-label>
      <input matInput type="time" formControlName="dueTime" />
    </mat-form-field>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancel</button>
  <button mat-flat-button color="primary" type="button" (click)="save()" [disabled]="saving || !ready">Save</button>
</mat-dialog-actions>
