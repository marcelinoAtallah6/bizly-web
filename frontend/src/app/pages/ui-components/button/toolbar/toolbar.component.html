    <!-- Regular buttons -->
    <ng-container *ngFor="let button of toolbar">
      <ng-container *ngIf="!button.hasSubmenu">
        <button
          mat-icon-button
          [matTooltip]="button.tooltip"
          (click)="button.action && button.action()"
        >
          <mat-icon>{{ button.icon }}</mat-icon>
        </button>
       
      </ng-container>

      <!-- Buttons with submenus -->
      <ng-container *ngIf="button.hasSubmenu">
        <button
          mat-icon-button
          [matTooltip]="button.tooltip"
          [matMenuTriggerFor]="menu"
        >
          <mat-icon>{{ button.icon }}</mat-icon>
        </button>
        <mat-menu #menu="matMenu">
          <button
            mat-menu-item
            *ngFor="let item of button.submenuItems"
            (click)="item.action()"
          >
            <mat-icon>{{ item.icon }}</mat-icon>
            <span>{{ item.label }}</span>
          </button>
        </mat-menu>
      </ng-container>
    </ng-container>
  </div>
</mat-toolbar>
