<!-- Plain div: nested mat-toolbar can swallow pointer events / layout oddly inside flex headers -->
<div class="email-toolbar" role="toolbar">
  <div class="button-group">
    <ng-container *ngFor="let button of toolbar; trackBy: trackToolbarBtn">
      <ng-container *ngIf="!button.hasSubmenu && !button.hidden">
        <button
          mat-icon-button
          type="button"
          [matTooltip]="button.tooltip"
          [disabled]="button.disabled"
          [color]="button.color"
          (click)="invoke(button, $event)"
        >
          <mat-icon>{{ button.icon }}</mat-icon>
        </button>
      </ng-container>

      <ng-container *ngIf="button.hasSubmenu && !button.hidden">
        <button
          mat-icon-button
          type="button"
          [matTooltip]="button.tooltip"
          [disabled]="button.disabled"
          [color]="button.color"
          [matMenuTriggerFor]="subMenu"
        >
          <mat-icon>{{ button.icon }}</mat-icon>
        </button>
        <mat-menu #subMenu="matMenu">
          <button
            mat-menu-item
            type="button"
            *ngFor="let item of button.submenuItems"
            (click)="item.action()"
          >
            <mat-icon>{{ item.icon }}</mat-icon>
            <span>{{ item.label }}</span>
          </button>
        </mat-menu>
      </ng-container>
    </ng-container>
  </div>
</div>
