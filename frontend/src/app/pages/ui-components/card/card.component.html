<div class="col-lg-{{ size }}">
  <mat-card class="mat-mdc-card mdc-card cardWithShadow theme-card">
    <mat-card-header class="mat-mdc-card-header">
      <div class="header-container">
        <mat-card-title class="mat-mdc-card-title m-b-0">
          {{ cardTitle }}
        </mat-card-title>
        <custom-toolbar [toolbar]="toolbar"  *ngIf="switchOption"></custom-toolbar>
      </div>
    </mat-card-header>
    <mat-card-content class="mat-mdc-card-content b-t-1">
      <ng-content></ng-content>
    </mat-card-content>
  </mat-card>
</div>
