<div class="form-ele-parent mb-3 mb-3">
  <div class="row">
    <div class="col-lg-8 col-md-9 col-sm-9 col-xs-9">
      <mat-checkbox
        [formControl]="formField"
        [checked]="formField.value"
        [disabled]="disabled"
        [required]="isRequired"
        (change)="updateValue($event)"
      >
        {{ label }}
      </mat-checkbox>
      <!-- <mat-error *ngIf="showError && formField.hasError('required')">
            Field Required.
          </mat-error> -->
    </div>
  </div>
</div>
