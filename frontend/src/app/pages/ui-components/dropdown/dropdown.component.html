<div class="row">
  <div class="col-lg-4 col-md-3 col-sm-3 col-xs-3 d-flex align-items-center justify-content-end">
    <mat-label class="mat-subtitle-2 f-w-600 d-block m-b-24">{{ label }}</mat-label>
    </div>
    <div class="col-lg-8 col-md-9 col-sm-9 col-xs-9">
      <mat-form-field appearance="outline" class="w-100">
        <mat-icon matPrefix>{{ icon }}</mat-icon>
        <mat-select 
          [placeholder]="placeholder"
          [value]="selectedValue" 
          [formControl]="formField"  [multiple]="isMultiple"
          (selectionChange)="onChange($event)">
          <mat-option *ngFor="let element of list" [value]="element.id">
            {{ element.name }}
          </mat-option>
        </mat-select>
        <!-- <mat-error *ngIf="formField.invalid">
          Field Required.</mat-error
        > -->
        <mat-error *ngIf="isRequired && !value"
        >Field Required.</mat-error
      >
      </mat-form-field>
    </div>
  </div>
