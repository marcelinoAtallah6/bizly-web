<div class="form-ele-parent mb-3 mb-3">
  <div class="row">
    <div class="col-lg-4 col-md-3 col-sm-3 col-xs-3 d-flex align-items-center justify-content-end" *ngIf="label !== ''">
      <mat-label class="mat-subtitle-2 f-w-600 d-block m-b-24">{{
        label
      }}</mat-label>
    </div>  
    <div class="col-lg-8 col-md-9 col-sm-9 col-xs-9">
      <mat-form-field appearance="outline" class="w-100">
        <mat-icon matPrefix>{{ icon }}</mat-icon>
        <input
          matInput
          [placeholder]="placeholder"
          [type]="type"
          [required]="isRequired"
          [formControl]="formField"
          [id]="fieldName"
          [name]="fieldName"
        />
        <mat-error *ngIf="isRequired && !value"
          >Field Required.</mat-error
        >
        <mat-error *ngIf="minLength && value && value.length < minLength">
          Minimum length is {{ minLength }}.
        </mat-error>
        <mat-error *ngIf="maxLength && value && value.length > maxLength">
          Maximum length is {{ maxLength }}.
        </mat-error>
      </mat-form-field>
    </div>
  </div>
</div>
