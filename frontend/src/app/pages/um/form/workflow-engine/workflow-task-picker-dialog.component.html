<div class="wf-picker">
  <h2 mat-dialog-title>Add step</h2>
  <mat-dialog-content>
    <mat-form-field appearance="outline" class="wf-picker__search full">
      <mat-label>Search tasks</mat-label>
      <input matInput [formControl]="searchControl" placeholder="Search tasks..." />
      <mat-icon matPrefix>search</mat-icon>
    </mat-form-field>

    <nav class="wf-picker__tabs" mat-tab-nav-bar [tabPanel]="tabPanel">
      <a
        mat-tab-link
        *ngFor="let key of tabOrder"
        [active]="activeCategory === key"
        (click)="activeCategory = key"
      >
        {{ categoryLabel(key) }}
      </a>
    </nav>
    <mat-tab-nav-panel #tabPanel></mat-tab-nav-panel>

    <div class="wf-picker__grid">
      <button
        type="button"
        class="wf-picker__card"
        *ngFor="let item of filteredItems"
        [class.wf-picker__card--selected]="selected?.taskKey === item.taskKey"
        (click)="select(item)"
      >
        <i-tabler [name]="iconFor(item)" class="wf-picker__icon wf-theme-icon"></i-tabler>
        <span class="wf-picker__title">{{ item.title }}</span>
        <span class="wf-picker__desc" *ngIf="item.description">{{ item.description }}</span>
      </button>
    </div>
    <p class="wf-picker__empty text-muted" *ngIf="!filteredItems.length">No tasks match your search.</p>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-stroked-button type="button" (click)="cancel()">Cancel</button>
    <button mat-flat-button color="primary" type="button" [disabled]="!selected" (click)="confirm()">
      Add to pipeline
    </button>
  </mat-dialog-actions>
</div>
