<div class="p-24">
  <app-page-action-bar title="Audit log" [toolbar]="listToolbar"></app-page-action-bar>

  <ag-grid-angular
    class="ag-theme-quartz"
    style="width: 100%; height: min(70vh, 640px)"
    [rowData]="rowData"
    [columnDefs]="columnDefs"
    [defaultColDef]="defaultColDef"
    [pagination]="false"
    [animateRows]="true"
    (gridReady)="onGridReady($event)"
  ></ag-grid-angular>

  <mat-paginator
    class="m-t-8"
    [length]="totalCount"
    [pageIndex]="pageNumber"
    [pageSize]="pageSize"
    [pageSizeOptions]="[10, 25, 50, 100]"
    [showFirstLastButtons]="true"
    [disabled]="loading"
    (page)="onPage($event)"
  ></mat-paginator>

  <p class="text-muted f-s-12 m-t-8 m-b-0">
    Entries are recorded automatically from annotated UM APIs (user add/update/delete).
  </p>
</div>
